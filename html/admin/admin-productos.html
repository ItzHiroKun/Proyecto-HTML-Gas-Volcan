<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de productos — Gas El Volcán</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="admin-body">
    
    <div class="d-flex">
        <!-- ===================== SIDEBAR ===================== -->
        <aside class="admin-sidebar" style="width: 240px;">
            <div class="marca-admin">🔥 Gas El Volcán<br><span class="small fw-normal">Panel administrativo</span></div>
            <nav class="nav flex-column">
                <a class="nav-link" href="admin-inicio.html">📊 Inicio</a>
                <a class="nav-link active" href="admin-productos.html">📦 Productos</a>
                <a class="nav-link" href="admin-usuarios.html">👥 Usuarios</a>
                <a class="nav-link" href="../index.html">← Volver al sitio</a>
            </nav>
        </aside>
        
        <!-- ===================== CONTENIDO ===================== -->
        <main class="flex-grow-1 admin-contenido">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <h1 class="mb-0">Mantenedor de productos</h1>
            </div>
            <p class="text-muted mb-4">Edita precio y stock del catálogo. Los cambios se guardan en este navegador (sin base de datos).</p>
            
            <div class="tarjeta p-3">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-productos">
                            <!-- Filas generadas dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <!-- ===================== MODAL DE EDICIÓN ===================== -->
    <div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="form-editar-producto">
                    <div class="modal-body">
                        <input type="hidden" id="editar-codigo">
                        
                        <div class="mb-3">
                            <label for="editar-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editar-nombre" required>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-6">
                                <label for="editar-precio" class="form-label">Precio (CLP)</label>
                                <input type="number" class="form-control" id="editar-precio" min="0" required>
                            </div>
                            <div class="col-6">
                                <label for="editar-stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="editar-stock" min="0" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-flama">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/admin-datos.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>
</html>
